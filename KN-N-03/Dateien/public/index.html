<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KN-N-03 — Neo4j Abfragen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-bottom: 2px solid #2563eb;
      padding: 1.5rem 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      color: #60a5fa;
    }

    header p {
      color: #9ca3af;
      margin-top: 0.3rem;
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .controls {
      text-align: center;
      margin-bottom: 2rem;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #4b5563; cursor: wait; }

    .status {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #9ca3af;
    }

    .status.error { color: #f87171; }
    .status.success { color: #34d399; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: #2563eb; }

    .card-header {
      background: #16213e;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #2d2d44;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h2 {
      font-size: 1rem;
      color: #60a5fa;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
      background: #1e3a5f;
      color: #60a5fa;
    }

    .card-body {
      padding: 1rem 1.25rem;
      overflow-x: auto;
    }

    .card-body p.desc {
      color: #9ca3af;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      background: #0f0f1a;
      color: #60a5fa;
      border-bottom: 1px solid #2d2d44;
      white-space: nowrap;
    }

    td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #1f1f35;
      white-space: nowrap;
    }

    tr:hover td { background: #1f1f35; }

    .empty { color: #6b7280; font-style: italic; }

    .count {
      font-size: 0.8rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <header>
    <h1>KN-N-03 — Neo4j Abfragen</h1>
    <p>Neo4j AuraDB &middot; Node.js &middot; 4 Cypher Queries</p>
  </header>

  <main>
    <div class="controls">
      <button class="btn" id="loadBtn" onclick="loadQueries()">Abfragen laden</button>
      <div class="status" id="status"></div>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <script>
    const queries = [
      { key: "q1", title: "Q1: Action-RPGs mit Bewertung > 8.0", desc: "WHERE auf Knoten-Attributen (KN-N-02 Q1)" },
      { key: "q2", title: "Q2: Minecraft Besitzer mit Kaufpreis", desc: "WHERE + Kanten-Attribute (KN-N-02 Q2)" },
      { key: "q3", title: "Q3: Japanische Entwickler → Spiel → Plattform", desc: "Multi-Hop-Traversal (KN-N-02 Q3)" },
      { key: "q4", title: "Q4: Spielstunden > 100, sortiert", desc: "WHERE auf Kante + ORDER BY (KN-N-02 Q4)" }
    ];

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = String(str);
      return div.innerHTML;
    }

    function buildTable(data) {
      if (!data || data.length === 0) return '<p class="empty">Keine Ergebnisse</p>';

      const keys = [...new Set(data.flatMap(d => Object.keys(d)))];
      if (keys.length === 0) return '<p class="empty">Keine Felder</p>';

      let html = '<table><thead><tr>';
      for (const k of keys) html += `<th>${escapeHtml(k)}</th>`;
      html += '</tr></thead><tbody>';

      for (const row of data) {
        html += '<tr>';
        for (const k of keys) {
          const val = row[k];
          const display = (val && typeof val === "object") ? JSON.stringify(val) : (val ?? "");
          html += `<td>${escapeHtml(display)}</td>`;
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      return html;
    }

    async function loadQueries() {
      const btn = document.getElementById("loadBtn");
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");

      btn.disabled = true;
      status.className = "status";
      status.textContent = "Verbinde mit Neo4j AuraDB...";
      grid.innerHTML = "";

      try {
        const res = await fetch("/api/queries");
        const data = await res.json();

        if (data.error) {
          status.className = "status error";
          status.textContent = "Fehler: " + data.error;
          btn.disabled = false;
          return;
        }

        status.className = "status success";
        status.textContent = "Alle 4 Abfragen erfolgreich geladen.";

        for (const q of queries) {
          const results = data[q.key] || [];
          grid.innerHTML += `
            <div class="card">
              <div class="card-header">
                <h2>${escapeHtml(q.title)}</h2>
                <div>
                  <span class="count">${results.length} Ergebnis${results.length !== 1 ? "se" : ""}</span>
                  <span class="badge">Cypher</span>
                </div>
              </div>
              <div class="card-body">
                <p class="desc">${escapeHtml(q.desc)}</p>
                ${buildTable(results)}
              </div>
            </div>
          `;
        }
      } catch (err) {
        status.className = "status error";
        status.textContent = "Verbindungsfehler: " + err.message;
      }

      btn.disabled = false;
    }
  </script>
</body>
</html>
